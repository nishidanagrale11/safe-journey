<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Journey — Trusted Contact</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><div class="brand"><span class="logo">SJ</span><div><b>Safe Journey</b><small>Private trusted-contact map</small></div></div><span class="badge">PRIVATE ACCESS</span></header><main><section class="card"><p class="eyebrow">ACTIVE JOURNEY</p><h2 id="dest">Loading journey…</h2><p id="info" class="muted"></p><div id="empty" class="mapempty">Waiting for location update.</div><div id="map" class="live-map hide" aria-label="Interactive shared location map"></div><p><b>Latest coordinates:</b> <span id="coords">Not available</span></p><p id="updated" class="muted"></p><button class="secondary" onclick="load()">Refresh location</button><p class="muted">This view updates every 5 seconds. It shows the latest recorded location, not a guarantee of real-time connectivity.</p></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>let liveMap=null,liveMarker=null;const t=location.pathname.split('/').pop(),$=x=>document.getElementById(x),fmt=d=>d?new Date(d).toLocaleString():'—';async function load(){try{let r=await fetch('/api/share/'+encodeURIComponent(t)),d=await r.json();if(!r.ok)throw Error(d.error||'Sharing unavailable');$('dest').textContent='Destination: '+d.destination;$('info').textContent='ETA '+fmt(d.eta)+' · '+d.status;if(d.location){let l=d.location;$('coords').textContent=l.latitude.toFixed(6)+', '+l.longitude.toFixed(6);$('updated').textContent='Last location update '+fmt(l.capturedAt);$('map').classList.remove('hide');$('empty').classList.add('hide');updateMap(l.latitude,l.longitude)}}catch(e){$('dest').textContent='Location unavailable';$('info').textContent=e.message;$('empty').textContent='Journey ended, link revoked, or sharing disabled.';$('empty').classList.remove('hide');$('map').classList.add('hide')}}function updateMap(lat,lon){if(!window.L)return;if(!liveMap){liveMap=L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([lat,lon],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(liveMap);liveMarker=L.marker([lat,lon]).addTo(liveMap).bindPopup('Shared device location');setTimeout(()=>liveMap.invalidateSize(),100);return;}liveMarker.setLatLng([lat,lon]);}load();setInterval(load,5000)</script></body></html>
